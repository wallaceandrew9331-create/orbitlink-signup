server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwrite rather than append ($proxy_add_x_forwarded_for), so a client can't put a fake
        # address in front and dodge the per-IP rate limit. The API trusts this header.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
